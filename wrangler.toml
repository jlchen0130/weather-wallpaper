name = "amigurumi-weather-theme-server"
main = "backend/amigurumi-theme-server-worker.js"
compatibility_date = "2026-06-10"

[[r2_buckets]]
binding = "WALLPAPER_BUCKET"
bucket_name = "amigurumi-weather-wallpapers"

[vars]
OPENAI_IMAGE_MODEL = "gpt-image-1"
WALLPAPER_RETENTION_HOURS = "24"
MAX_DAILY_GENERATIONS_PER_CITY = "5"
PUBLIC_WORKER_ORIGIN = "https://amigurumi-weather-theme-server.wemmei0130.workers.dev"

[triggers]
crons = ["0 15,22 * * *", "0 4,9,12 * * *"]
